# Formación del clúster: cada nodo conoce la lista y se une a los otros al arrancar.
# El nombre de cada nodo es rabbit@<hostname>, por eso cada contenedor fija su hostname en docker-compose.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Cada nodo calcula su límite de memoria sobre el mem_limit del contenedor, no sobre la RAM de la EC2.
vm_memory_high_watermark.relative = 0.6
